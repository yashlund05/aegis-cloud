apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-orchestrator
  namespace: aegis-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aegis-orchestrator-role
rules:
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aegis-orchestrator-binding
subjects:
- kind: ServiceAccount
  name: aegis-orchestrator
  namespace: aegis-system
roleRef:
  kind: ClusterRole
  name: aegis-orchestrator-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-scheduler
  namespace: aegis-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aegis-scheduler-role
rules:
- apiGroups: [""]
  resources: ["nodes", "pods", "events", "bindings"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch", "update"]
- apiGroups: [""]
  resources: ["pods/binding"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aegis-scheduler-binding
subjects:
- kind: ServiceAccount
  name: aegis-scheduler
  namespace: aegis-system
roleRef:
  kind: ClusterRole
  name: aegis-scheduler-role
  apiGroup: rbac.authorization.k8s.io
---
