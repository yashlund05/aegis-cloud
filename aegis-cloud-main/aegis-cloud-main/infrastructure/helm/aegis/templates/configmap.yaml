apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegis.fullname" . }}-config
  namespace: aegis-system
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
data:
  POSTGRES_HOST: {{ .Values.config.postgresHost | quote }}
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  ENERGY_AWARE: {{ .Values.featureFlags.energyAware | quote }}
  PREDICTIVE_SCALING: {{ .Values.featureFlags.predictiveScaling | quote }}
