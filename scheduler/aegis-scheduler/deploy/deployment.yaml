apiVersion: v1
kind: Namespace
metadata:
  name: aegis-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-scheduler
  namespace: aegis-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aegis-scheduler-as-kube-scheduler
subjects:
- kind: ServiceAccount
  name: aegis-scheduler
  namespace: aegis-system
roleRef:
  kind: ClusterRole
  name: system:kube-scheduler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aegis-scheduler-as-volume-scheduler
subjects:
- kind: ServiceAccount
  name: aegis-scheduler
  namespace: aegis-system
roleRef:
  kind: ClusterRole
  name: system:volume-scheduler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-scheduler
  namespace: aegis-system
  labels:
    component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      component: scheduler
  template:
    metadata:
      labels:
        component: scheduler
    spec:
      serviceAccountName: aegis-scheduler
      containers:
        - name: aegis-scheduler
          image: aegis-project/aegis-scheduler:latest
          imagePullPolicy: IfNotPresent
          command:
            - /aegis-scheduler
            - --config=/etc/kubernetes/scheduler.yaml
            - --v=4
          resources:
            limits:
              cpu: "100m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          volumeMounts:
            - name: scheduler-config
              mountPath: /etc/kubernetes/scheduler.yaml
              subPath: scheduler.yaml
              readOnly: true
      volumes:
        - name: scheduler-config
          configMap:
            name: aegis-scheduler-config
