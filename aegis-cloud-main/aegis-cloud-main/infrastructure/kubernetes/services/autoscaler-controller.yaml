apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-autoscaler-controller
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: autoscaler-controller
    app.kubernetes.io/part-of: aegis
    app: aegis
    component: autoscaler-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: autoscaler-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autoscaler-controller
        app: aegis
        component: autoscaler-controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: aegis-autoscaler
      containers:
      - name: autoscaler-controller
        image: aegis/autoscaler-controller:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: aegis-autoscaler-controller-config
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-autoscaler-controller
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: autoscaler-controller
    app.kubernetes.io/part-of: aegis
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app.kubernetes.io/name: autoscaler-controller
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-autoscaler-controller-config
  namespace: aegis-system
data:
  PORT: "8000"
  REDIS_URL: "redis://redis.aegis-data:6379/0"
  DATABASE_URL: "postgres://aegis:changeme@postgres.aegis-data:5432/aegis_db"
